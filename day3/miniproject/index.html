<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Tip Calculator</title>
    <link rel="stylesheet"href="index.css">
</head>
<body>
    <div class="container">
  <h2>Tip Calculator</h2>
  <label>Bill Amount (RM):</label>
  <input type="number" id="billInput">
 
  <label>Tip Percentage (%):</label>
  <input type="number" id="tipInput">
 
  <button id="calculateBtn" disabled>Calculate</button>

  <label for="tip-percentage">Choose a tip percentage:</label>
<select name="tip-percentage" id="tip-percentage">
    <option value="0.05">5%</option>
    <option value="0.10">10%</option>
    <option value="0.15">15%</option>
    <option value="custom">Custom amount</option>
</select>

 
  <p id="result"></p>
</div>
<script src="index.js"></script>
</body>
</html>
